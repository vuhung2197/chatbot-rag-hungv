[project]
name = "ai-service"
version = "0.1.0"
description = "Lõi AI (intent + RAG + agent) cho chatbot học tiếng Anh — FastAPI, chạy hybrid song song backend Node."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "asyncpg>=0.31.0",
    "redis>=8.0.0",
    "openai>=2.43.0",
    "langgraph>=1.2.6",
    "mcp>=1.28.0",
]

[dependency-groups]
# Dev deps (uv): cài bằng `uv sync` (mặc định gồm group này).
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",        # TestClient cho FastAPI
    "ruff>=0.9",
    "black>=24.10",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Mặc định chỉ chạy unit (nhanh, không cần dịch vụ thật). Chạy integration/eval
# tường minh: `uv run pytest -m integration` / `-m eval`.
addopts = "-m 'not integration and not eval'"
markers = [
    "integration: test gọi LLM/DB/mạng thật (chạy thủ công, không chạy mặc định trong CI)",
    "eval: RAG/intent eval harness",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
